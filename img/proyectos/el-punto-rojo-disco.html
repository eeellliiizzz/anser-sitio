<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Punto Rojo — punto disco</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0A0A; }
  #escena { container-type: inline-size; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #punto { width: 22cqw; height: 22cqw; border-radius: 50%; background: #E8261B; box-shadow: 0 0 6cqw 1cqw rgba(232, 38, 27, .7); animation: disco 1.4s steps(1, end) infinite; }
  /* El punto parpadea en colores de pista y se queda en rojo */
  @keyframes disco {
    0% { background: #FF2BD6; box-shadow: 0 0 6cqw 1cqw #FF2BD6 }
    2.5% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    5% { background: #00E5FF; box-shadow: 0 0 6cqw 1cqw #00E5FF }
    7.5% { background: #FFE600; box-shadow: 0 0 6cqw 1cqw #FFE600 }
    10% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    12.5% { background: #2F5BFF; box-shadow: 0 0 6cqw 1cqw #2F5BFF }
    15% { background: #FFFFFF; box-shadow: 0 0 6cqw 1cqw #FFFFFF }
    17.5% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    20% { background: #00FF85; box-shadow: 0 0 6cqw 1cqw #00FF85 }
    22.5% { background: #FF2BD6; box-shadow: 0 0 6cqw 1cqw #FF2BD6 }
    25% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    27.5% { background: #FFE600; box-shadow: 0 0 6cqw 1cqw #FFE600 }
    30% { background: #00E5FF; box-shadow: 0 0 6cqw 1cqw #00E5FF }
    32.5% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    35% { background: #FFFFFF; box-shadow: 0 0 6cqw 1cqw #FFFFFF }
    37.5% { background: #141212; box-shadow: 0 0 0 0 rgba(0, 0, 0, 0) }
    40%, 100% { background: #E8261B; box-shadow: 0 0 6cqw 1cqw rgba(232, 38, 27, .7) }
  }
  @media (prefers-reduced-motion: reduce) { #punto { animation: none; } }
</style>
</head>
<body>
<div id="escena"><div id="punto"></div></div>
</body>
</html>
